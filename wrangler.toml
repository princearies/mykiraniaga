name = "mykiraniaga"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

# Worker-to-worker call for the AliExpress gateway (has the OAuth token).
[[services]]
binding = "MYKIRASHOP"
service = "mykirashop"

# MyKiraShop products D1 — source for /api/google-shopping-feed.xml
[[d1_databases]]
binding = "DB"
database_name = "mykirashop-db"
database_id = "57586de1-73ed-4d1e-911b-143eb6667772"

[vars]
GEMINI_MODEL = "gemini-flash-lite-latest"
ALIEXPRESS_BASE_URL = "https://api-sg.aliexpress.com/sync"
DEFAULT_USD_MYR = "4.72"
PRICE_MARKUP_PCT = "20"
PRICE_MARKUP_FLAT_MYR = "0"
WHATSAPP_ORDER_NUMBER = "60173735431"
ENVIRONMENT = "production"

# Secrets — set once, never in this file:
#   wrangler secret put GEMINI_API_KEY         (required for AI intent)
#   wrangler secret put CJ_MCP_USER            (CJ account id, enables live CJ)
#   wrangler secret put CJ_MCP_ACCESS_TOKEN    (CJ MCP JWT)
#   wrangler secret put ALIEXPRESS_APP_KEY     (optional, needs affiliate API permission)
#   wrangler secret put ALIEXPRESS_APP_SECRET  (optional)
#   wrangler secret put ALIEXPRESS_TRACKING_ID (optional)
